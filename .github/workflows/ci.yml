permissions:
  contents: read
name: CI

on:
  push:
    branches: [ "main"]
  pull_request:
    branches: [ "main"]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
    - uses: actions/checkout@v4
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
        cache: 'pip'
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e ".[dev]"
    - name: Test
      run: pytest -q
    - name: Lint
      run: ruff check jetformer scripts tests
    - name: Dead-code check
      run: vulture jetformer scripts tests --min-confidence 80
    - name: Compile
      run: python -m compileall -q jetformer scripts tests
    - name: Build package
      if: matrix.python-version == '3.12'
      run: python -m build --sdist --wheel
