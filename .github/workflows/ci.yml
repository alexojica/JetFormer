permissions:
  contents: read
name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
      with:
        python-version: "3.12"
        cache: 'pip'
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        python -m pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
        python -m pip install -e ".[dev]"
    - name: Lint
      run: ruff check jetformer tests
    - name: Format
      run: ruff format --check jetformer tests
    - name: Dead-code check
      run: vulture jetformer tests --min-confidence 60 --ignore-names "forward,synthetic_data"
    - name: Detect secrets
      run: pre-commit run detect-secrets --all-files
    - name: Build package
      run: |
        python -m build --sdist --wheel
        twine check dist/*

  test:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.10", "3.11", "3.12"]
        # The validated recipe and the published weights were produced on Apple Silicon, so the
        # MPS-specific branches (attention kernel, gradient norms, fused AdamW) get a runner too.
        include:
          - os: macos-latest
            python-version: "3.12"
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
      with:
        python-version: ${{ matrix.python-version }}
        cache: 'pip'
    - name: Install dependencies (Linux, CPU wheels)
      if: runner.os == 'Linux'
      run: |
        python -m pip install --upgrade pip
        python -m pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
        python -m pip install -e ".[dev]"
    - name: Install dependencies (macOS)
      if: runner.os == 'macOS'
      run: |
        python -m pip install --upgrade pip
        python -m pip install -e ".[dev]"
    - name: Test
      run: pytest -q
