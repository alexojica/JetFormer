# Medium-length CIFAR-10 curriculum run on Apple MPS (about 2 hours on a 64 GB M5 Pro).
#
# Architecture chosen from the 3-epoch local sweep (2026-09-09): 32 affine couplings with one ViT
# block each. Eight couplings saturated the sigmoid*2 scale cap (4.77 bpd), 16 reached 4.36, and 32
# reached 4.21 clean bits per subpixel at almost the same step cost. This run adds the cosine RGB
# noise curriculum (32 -> 0 in 8-bit units) to check sample quality before the long run.
num_epochs: 30
input: {val_max_samples_per_class: 200}
sampling: {cfg_weight: 3.0}
eval: {val_every_epochs: 1, sample_every_epochs: 5}
wandb:
  offline: true
  project: jetformer-cifar10-32
  run_name: CIFAR10-32-mps-f32-curriculum30
  tags: [cifar10, mps, f32, curriculum]
