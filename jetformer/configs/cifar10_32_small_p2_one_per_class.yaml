# Smallest visual CIFAR-10 JetFormer overfit.
#
# One training image per CIFAR-10 class. This makes each class token identify
# one real CIFAR image, so free-running class-conditional generation has a
# compact target instead of averaging many images per class.
#
# For visual inspection, sample the rolling *_last.pt checkpoint. The *_best.pt
# checkpoint is selected by held-out validation loss and is not expected to
# memorize these ten training images.
num_epochs: 1000
batch_size: 10
input: {max_samples_per_class: 1, val_max_samples_per_class: 1, random_flip_prob: 0.0}
model: {width: 128, depth: 4, mlp_dim: 512, num_heads: 4, num_mixtures: 32, scale_tol: 0.001, dropout: 0.0, drop_labels_probability: 0.0,
  num_class_repeats: 1}
image: {patch_size: 2, ar_dim: 12}
flow: {depth: 16, emb_dim: 128, num_heads: 4}
optimizer: {lr: 0.001, wd: 1.0e-05}
schedule: {warmup_percent: 0.03}
training: {input_noise_std: 0.0, noise_scale: 0.0}
sampling: {temperature: 1.0, cfg_weight: 0.0}
eval: {val_every_epochs: 100, sample_every_epochs: 0}
logging: {every_batches: 1, advanced_metrics: true}
wandb:
  enabled: false
  offline: true
  project: jetformer-cifar10-32
  run_name: CIFAR10-32-small-p2-one-per-class
  tags: [cifar10, small, p2, one-per-class, overfit]
accelerator: {precision: fp32}
