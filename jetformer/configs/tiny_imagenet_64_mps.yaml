# Public Tiny ImageNet 64x64 research config for Apple Silicon / MPS.
#
# Tiny ImageNet has 100k training images, 10k validation images, 200 classes,
# and 64x64 RGB inputs. This config uses raw 4x4 RGB patch tokens, so its
# sequence length matches 32x32 CIFAR with 2x2 patches while the image-token
# dimension rises from 12 to 48.
batch_size: 8
grad_accum_steps: 4
input:
  dataset: tiny_imagenet_hf
  input_size: [64, 64]
  num_classes: 200
  val_max_samples_per_class: 10
model: {width: 512, mlp_dim: 2048, num_heads: 16, num_mixtures: 64, scale_tol: 0.001, num_class_repeats: 1}
image: {ar_dim: 48}
flow: {depth: 16, emb_dim: 512, num_heads: 16}
optimizer: {lr: 0.0002}
training: {input_noise_std: 0.0, noise_scale: 0.0}
sampling: {temperature: 0.8, temperature_probs: 0.8, cfg_weight: 1.0}
eval: {val_every_epochs: 1, sample_every_epochs: 0}
logging: {every_batches: 100, advanced_metrics: true}
wandb:
  enabled: false
  offline: true
  project: jetformer-tiny-imagenet-64
  run_name: TinyImageNet-64-mps-p4
  tags: [tiny-imagenet, 64x64, mps, p4]
