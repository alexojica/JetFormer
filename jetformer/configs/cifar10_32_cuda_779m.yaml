# Paper-shape JetFormer-B components scaled only at the CIFAR patch interface.
#
# This is a CUDA target, not a blind launch configuration. Before the optional
# full run, benchmark the hardware-specific microbatch and checkpoint policy
# from docs/cuda_experiment.md. The checked-in single-GPU baseline keeps global
# batch 128 with a per-process microbatch of 32 and four-way accumulation.
batch_size: 32
grad_accum_steps: 4
torch_compile: true
input: {val_max_samples_per_class: 384}
model: {width: 1024, depth: 24, mlp_dim: 4096, num_heads: 16, num_mixtures: 1024, grad_checkpoint: true}
flow: {block_depth: 4, emb_dim: 512, num_heads: 8, grad_checkpoint: true}
optimizer: {lr: 0.00025, fused: true}
schedule: {warmup_percent: 0.1}
training: {noise_scale: 64.0, noise_min: 3.0}
sampling: {temperature: 0.94, cfg_weight: 3.0}
eval: {val_every_epochs: 5, sample_every_epochs: 5, sample_num_images: 20}
wandb:
  offline: true
  project: jetformer-cifar10-32
  run_name: CIFAR10-32-cuda-paper-779m
  tags: [cifar10, cuda, paper-aligned, 779m, noise-floor-3]
accelerator: {device: cuda}
