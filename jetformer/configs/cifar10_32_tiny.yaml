# Tiny executable CIFAR-10 JetFormer config for local smoke training.
num_epochs: 2
batch_size: 16
input: {max_samples: 256, val_max_samples: 128}
model: {width: 64, depth: 2, mlp_dim: 256, num_heads: 4, num_mixtures: 8, scale_tol: 0.001, dropout: 0.0, num_class_repeats: 1}
image: {ar_dim: 12}
flow: {depth: 4, emb_dim: 64, num_heads: 4}
optimizer: {lr: 0.0005}
training: {noise_scale: 16.0}
sampling: {temperature: 1.0, cfg_weight: 1.0}
eval: {val_every_epochs: 1, sample_every_epochs: 0}
logging: {every_batches: 1, advanced_metrics: true}
wandb:
  enabled: false
  offline: true
  project: jetformer-cifar10-32
  run_name: CIFAR10-32-tiny-smoke
  tags: [cifar10, tiny, smoke]
accelerator: {precision: fp32}
