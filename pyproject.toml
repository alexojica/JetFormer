[build-system]
requires = ["setuptools>=77.0"]
build-backend = "setuptools.build_meta"

[project]
name = "jetformer"
version = "0.1.1"
description = "PyTorch implementation of the Jet normalizing flow and the JetFormer image model"
readme = "README.md"
requires-python = ">=3.10"
authors = [
    { name = "Alexandru Ojica" },
]
license = "MIT AND Apache-2.0"
license-files = ["LICENSE", "NOTICE", "LICENSES/*"]
keywords = ["generative-modeling", "normalizing-flows", "pytorch", "transformers"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "torch>=2.7.0",
    "torchvision>=0.22.0",
    "numpy>=1.24",
    "pillow>=9.0.0",
    "tqdm>=4.65.0",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
eval = [
    "torch-fidelity>=0.3.0",
]
hub = [
    "huggingface_hub>=0.19.0",
]
hf = [
    "datasets>=2.18.0",
    "huggingface_hub>=0.19.0",
]
wandb = [
    "wandb>=0.15.0",
]
tfds = [
    "array-record>=0.6.0",
    "tensorflow-datasets>=4.9.0",
]
dev = [
    "build>=1.2.0",
    "datasets>=2.18.0",
    "pre-commit>=4.0.0",
    "pytest>=8.0.0",
    "ruff==0.15.20",
    "twine>=6.1.0",
    "vulture==2.16",
    "wandb>=0.15.0",
]

[project.scripts]
jetformer-benchmark = "jetformer.benchmark:main"
jetformer-export = "jetformer.export:main"
jetformer-sample = "jetformer.sample:main"
jetformer-train = "jetformer.train:main"

[project.urls]
Homepage = "https://github.com/alexojica/JetFormer"
Issues = "https://github.com/alexojica/JetFormer/issues"
Repository = "https://github.com/alexojica/JetFormer.git"

[tool.ruff]
target-version = "py310"
line-length = 120
extend-exclude = ["external", "data", "checkpoints", "samples", "wandb"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B", "RUF"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools.packages.find]
where = ["."]
include = ["jetformer*"]

[tool.setuptools.package-data]
"jetformer.configs" = ["*.yaml"]
